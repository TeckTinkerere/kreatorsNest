    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=v01.1" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v=v01.1" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png?v=v01.1" />
    <meta name="apple-mobile-web-app-title" content="KreatorNest" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest?v=v01.1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2C2B29" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>KreatorNest - Creative Freelance Resource Hub</title>
    <script>
      // Capture beforeinstallprompt early (Android / Linux / desktop Chromium).
      // React mounts later — without this, the event is often missed.
      (function () {
        var bridge = (window.__kreatorNestPwa = window.__kreatorNestPwa || { deferredPrompt: null });
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          bridge.deferredPrompt = e;
          window.dispatchEvent(new Event('pwa-install-available'));
        });
        window.addEventListener('appinstalled', function () {
          bridge.deferredPrompt = null;
          try { localStorage.setItem('kreatornest-pwa-installed', '1'); } catch (e) {}
          window.dispatchEvent(new Event('pwa-installed'));
        });
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--sa
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%PUBLIC_URL%/sw.js')
            .then(registration => {
              console.log('SW registered:', registration.scope);
            })
            .catch(err => {
              console.log('SW registration failed:', err);
            });
        });

        // If a waiting SW exists, skip waiting so the new one activates immediately
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          // Only reload once to avoid loops
          if (!sessionStorage.getItem('sw-reloaded')) {
            sessionStorage.setItem('sw-reloaded', '1');
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
